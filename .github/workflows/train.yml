name: Daily Model Training

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  

      - name: Install dependencies (clean, no cache)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      # ─── CRITICAL: Verify exact versions before training ──────────────
      - name: Verify dependency versions
        run: |
          python -c "
          import sklearn, numpy, pandas, mlflow
          versions = {
              'scikit-learn': (sklearn.__version__, '1.4.2'),
              'numpy':        (numpy.__version__,   '1.26.4'),
              'pandas':       (pandas.__version__,  '2.2.0'),
              'mlflow':       (mlflow.__version__,  '2.15.1'),
          }
          failed = []
          for lib, (got, expected) in versions.items():
              status = '✅' if got == expected else '❌'
              print(f'{status} {lib}: installed={got}, expected={expected}')
              if got != expected:
                  failed.append(f'{lib}=={got} (need {expected})')
          if failed:
              raise SystemExit(f'VERSION MISMATCH — fix requirements.txt: {failed}')
          print()
          print('✅ All versions verified — safe to train')
          "
      # ──────────────────────────────────────────────────────────────────

      - name: Run training
        env:
          DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
        run: python src/train.py

      - name: Upload training logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: training-logs
          path: |
            *.log
            logs/
          retention-days: 7
